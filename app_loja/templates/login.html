{% extends 'base.html' %}
{% block content %}
<section class="card narrow">
  <h1>Ingresá a la tienda</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="login">Rol</label>
    <select id="login" name="login" autocomplete="username" autofocus required>
      {% for login,nombre in cuentas %}<option value="{{ login }}"{% if request.form.get('login')==login %} selected{% endif %}>{{ nombre }}</option>
      {% endfor %}</select>
    <label for="senha" style="margin-top:20px">Contraseña</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <div class="actions"><button>Ingresar</button></div>
  </form>
</section>
{% endblock %}
