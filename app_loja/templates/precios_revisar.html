{% extends 'base.html' %}{% block content %}<h1>Revisar cambios</h1>
<div class="card table-wrap"><table><thead><tr><th>Producto</th><th>Precio anterior</th><th>Precio nuevo</th></tr></thead><tbody>{% for a in alteracoes %}<tr><td>{{ nomes[a.produto_id] }}</td><td>{{ a.anterior|importe }} / {{ unidades[a.produto_id] }}</td><td>{{ a.novo|importe }} / {{ unidades[a.produto_id] }}</td></tr>{% endfor %}</tbody></table></div>
<form method="post" action="{{ url_for('precios.confirmar') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="envio" value="{{ envio }}"><input type="hidden" name="confirmado" value="si"><div class="actions"><button>Confirmar cambios</button></div></form><form method="post" action="{{ url_for('precios.editar') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="envio" value="{{ envio }}"><button class="secondary">Seguir editando</button></form>{% endblock %}
